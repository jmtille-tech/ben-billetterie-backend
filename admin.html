<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEN Billetterie — Espace interne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EEF0E4;
    --paper-raised: #F7F8F1;
    --ink: #1E2B1F;
    --ink-soft: #4B564C;
    --moss: #3F6B4A;
    --moss-dark: #2C4C34;
    --ochre: #A9782F;
    --hairline: #CBCEBA;
    --hairline-strong: #A9AD93;
    --warn: #8a3b25;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Source Sans 3', sans-serif;
  }
  .app { max-width: 920px; margin: 0 auto; padding: 2.5rem 1.5rem 3rem; }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.7rem;
    margin: 0 0 0.3rem;
  }
  .subhead { color: var(--ink-soft); margin: 0 0 2rem; font-size: 0.92rem; }
  .login-box {
    max-width: 360px;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  input.field {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 0.95rem;
    padding: 0.6rem 0.75rem;
    background: var(--paper-raised);
    border: 1px solid var(--hairline-strong);
    border-radius: 3px;
    color: var(--ink);
  }
  input.field:focus { outline: none; border-color: var(--moss); }
  button {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    color: #fff;
    background: var(--moss);
    border: none;
    padding: 0.6rem 1.1rem;
    border-radius: 3px;
    cursor: pointer;
  }
  button:hover { background: var(--moss-dark); }
  button:disabled { opacity: 0.6; cursor: default; }
  button.secondary {
    background: transparent;
    color: var(--moss-dark);
    border: 1px solid var(--moss);
  }
  button.secondary:hover { background: rgba(63,107,74,0.08); }
  .error { color: var(--warn); font-size: 0.85rem; margin-top: 0.25rem; }
  .toolbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 1.25rem;
  }
  .card {
    background: var(--paper-raised);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    padding: 1.1rem 1.25rem;
    margin-bottom: 1rem;
  }
  .card-head {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 1rem; flex-wrap: wrap;
    cursor: pointer;
  }
  .card-title { font-weight: 600; font-size: 1rem; }
  .card-meta { font-size: 0.8rem; color: var(--ink-soft); }
  .badge {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .badge.en_attente { background: #f0e6cf; color: var(--ochre); }
  .badge.valide { background: #dbe8dd; color: var(--moss-dark); }
  .card-body { margin-top: 1rem; display: none; }
  .card.open .card-body { display: block; }
  .card.open .chevron { transform: rotate(90deg); }
  .chevron { display: inline-block; transition: transform 0.15s; margin-right: 0.4rem; }
  .synthese {
    white-space: pre-wrap;
    font-size: 0.92rem;
    line-height: 1.55;
    background: var(--paper);
    border: 1px solid var(--hairline);
    border-radius: 3px;
    padding: 0.9rem 1rem;
    margin: 0.5rem 0 1rem;
  }
  details.raw-json summary {
    font-size: 0.78rem;
    color: var(--ochre);
    cursor: pointer;
    font-weight: 600;
  }
  details.raw-json pre {
    font-size: 0.76rem;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    background: var(--paper);
    border: 1px solid var(--hairline);
    border-radius: 3px;
    padding: 0.75rem;
    margin-top: 0.5rem;
  }
  .row-actions { display: flex; gap: 0.6rem; margin-top: 1rem; align-items: center; }
  .empty { color: var(--ink-soft); font-size: 0.9rem; padding: 2rem 0; }
  .score-op {
    background: var(--paper);
    border: 1px solid var(--hairline);
    border-radius: 3px;
    padding: 0.7rem 0.9rem;
    margin-top: 0.6rem;
  }
  .score-op-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 0.92rem;
  }
  .score-op-head span { color: var(--ochre); font-weight: 600; }
  .score-op details summary {
    font-size: 0.78rem;
    color: var(--ink-soft);
    cursor: pointer;
    margin-top: 0.4rem;
  }
  .score-detail-list { margin-top: 0.4rem; }
  .score-detail-line {
    font-size: 0.8rem;
    color: var(--ink-soft);
    padding: 0.1rem 0;
  }
  .score-detail-line.ok { color: var(--moss-dark); }
  .score-manual {
    font-size: 0.8rem;
    color: var(--ochre);
    margin-top: 0.4rem;
    font-style: italic;
  }
  textarea.notes {
    width: 100%;
    min-height: 60px;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 0.88rem;
    padding: 0.5rem 0.65rem;
    background: var(--paper);
    border: 1px solid var(--hairline);
    border-radius: 3px;
    color: var(--ink);
    margin-top: 0.75rem;
    resize: vertical;
  }
</style>
</head>
<body>
<div class="app">
  <h1>BEN Billetterie — Espace interne</h1>
  <p class="subhead">Consultation et validation des entretiens reçus. Réservé à Jean-Marc.</p>

  <div id="loginBox" class="login-box">
    <input type="password" class="field" id="passwordInput" placeholder="Mot de passe">
    <button id="loginBtn">Accéder</button>
    <div class="error" id="loginError"></div>
  </div>

  <div id="mainView" style="display:none;">
    <div class="toolbar">
      <div class="card-meta" id="countLabel"></div>
      <button class="secondary" id="refreshBtn">Rafraîchir</button>
    </div>
    <div id="list"></div>
  </div>
</div>

<script>
const BACKEND_URL = 'https://ben-billetterie-backend.vercel.app/api/admin';

let password = '';
let rows = [];

const loginBox = document.getElementById('loginBox');
const passwordInput = document.getElementById('passwordInput');
const loginBtn = document.getElementById('loginBtn');
const loginError = document.getElementById('loginError');
const mainView = document.getElementById('mainView');
const listEl = document.getElementById('list');
const countLabel = document.getElementById('countLabel');
const refreshBtn = document.getElementById('refreshBtn');

async function callAdmin(action, extra) {
  const body = Object.assign({ password: password, action: action }, extra || {});
  const response = await fetch(BACKEND_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const result = await response.json();
  if (!response.ok) {
    throw new Error(result.error || 'Erreur (' + response.status + ')');
  }
  return result;
}

function renderScoreResult(container, result) {
  container.innerHTML = '';
  if (!result || !result.shortlist) return;

  const meta = document.createElement('div');
  meta.className = 'card-meta';
  meta.style.marginTop = '0.9rem';
  meta.textContent = 'Calculé le ' + formatDate(result.calcule_le) + ' — ' +
    result.nb_survivants_prerequis + ' opérateur(s) passent le filtre prérequis sur ' + result.nb_candidats_evalues + ' évalués. Shortlist des 5 mieux notés ci-dessous — à toi de retenir les 3 finaux.';
  container.appendChild(meta);

  result.shortlist.forEach(function (op, index) {
    const opCard = document.createElement('div');
    opCard.className = 'score-op';

    const opHead = document.createElement('div');
    opHead.className = 'score-op-head';
    opHead.innerHTML = '<strong>' + (index + 1) + '. ' + op.name + '</strong><span>' + op.score + ' pts</span>';
    opCard.appendChild(opHead);

    const details = document.createElement('details');
    const summary = document.createElement('summary');
    summary.textContent = 'Détail du score';
    const list = document.createElement('div');
    list.className = 'score-detail-list';
    (op.detail || []).forEach(function (d) {
      const line = document.createElement('div');
      line.className = 'score-detail-line' + (d.obtained ? ' ok' : '');
      line.textContent = d.label + ' — ' + d.points + '/' + d.weight;
      list.appendChild(line);
    });
    if (op.a_comparer_manuellement) {
      const manual = document.createElement('div');
      manual.className = 'score-manual';
      manual.textContent = 'À comparer toi-même : modèle de prix = ' +
        (op.a_comparer_manuellement.modele_prix || '?') + ', langue solution = ' +
        (op.a_comparer_manuellement.langues_solution || '?');
      list.appendChild(manual);
    }
    details.appendChild(summary);
    details.appendChild(list);
    opCard.appendChild(details);

    container.appendChild(opCard);
  });

  if (result.shortlist.length === 0) {
    const none = document.createElement('div');
    none.className = 'empty';
    none.textContent = 'Aucun opérateur ne passe le filtre prérequis pour cet entretien.';
    container.appendChild(none);
  }
}

function formatDate(iso) {
  try {
    return new Date(iso).toLocaleString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  } catch (e) {
    return iso;
  }
}

function renderList() {
  listEl.innerHTML = '';
  countLabel.textContent = rows.length + ' entretien' + (rows.length > 1 ? 's' : '');
  if (rows.length === 0) {
    listEl.innerHTML = '<div class="empty">Aucun entretien pour le moment.</div>';
    return;
  }
  rows.forEach(function (row) {
    const card = document.createElement('div');
    card.className = 'card';

    const head = document.createElement('div');
    head.className = 'card-head';
    head.innerHTML =
      '<div class="card-title"><span class="chevron">&#9656;</span>' +
      (row.nom_site || (row.prenom + ' ' + row.nom)) +
      '</div>' +
      '<div class="card-meta">' +
      (row.prenom + ' ' + row.nom + ' — ' + (row.fonction || '') + ' · ' + formatDate(row.created_at)) +
      ' <span class="badge ' + row.statut + '">' + row.statut.replace('_', ' ') + '</span>' +
      '</div>';
    head.addEventListener('click', function () {
      card.classList.toggle('open');
    });

    const bodyEl = document.createElement('div');
    bodyEl.className = 'card-body';

    const synthese = document.createElement('div');
    synthese.className = 'synthese';
    synthese.textContent = row.synthese_texte || '(pas de synthèse enregistrée)';
    bodyEl.appendChild(synthese);

    const rawDetails = document.createElement('details');
    rawDetails.className = 'raw-json';
    const summary = document.createElement('summary');
    summary.textContent = 'Données structurées (JSON)';
    const pre = document.createElement('pre');
    pre.textContent = row.donnees_structurees ? JSON.stringify(row.donnees_structurees, null, 2) : '(vide)';
    rawDetails.appendChild(summary);
    rawDetails.appendChild(pre);
    bodyEl.appendChild(rawDetails);

    const notes = document.createElement('textarea');
    notes.className = 'notes';
    notes.placeholder = 'Notes internes (visibles uniquement par toi)...';
    notes.value = row.notes_jeanmarc || '';

    const actions = document.createElement('div');
    actions.className = 'row-actions';

    const saveNoteBtn = document.createElement('button');
    saveNoteBtn.className = 'secondary';
    saveNoteBtn.textContent = 'Enregistrer la note';
    saveNoteBtn.addEventListener('click', async function () {
      saveNoteBtn.disabled = true;
      try {
        await callAdmin('note', { id: row.id, notes: notes.value });
        row.notes_jeanmarc = notes.value;
      } catch (err) {
        alert(err.message);
      } finally {
        saveNoteBtn.disabled = false;
      }
    });

    actions.appendChild(saveNoteBtn);

    if (row.statut !== 'valide') {
      const validateBtn = document.createElement('button');
      validateBtn.textContent = 'Valider ce récapitulatif';
      validateBtn.addEventListener('click', async function () {
        if (!confirm('Confirmer la validation de cet entretien ?')) return;
        validateBtn.disabled = true;
        try {
          await callAdmin('validate', { id: row.id });
          await loadRows();
        } catch (err) {
          alert(err.message);
          validateBtn.disabled = false;
        }
      });
      actions.appendChild(validateBtn);
    } else {
      const validatedNote = document.createElement('span');
      validatedNote.className = 'card-meta';
      validatedNote.textContent = 'Validé le ' + formatDate(row.valide_at);
      actions.appendChild(validatedNote);
    }

    const scoreBtn = document.createElement('button');
    scoreBtn.className = 'secondary';
    scoreBtn.textContent = row.operateurs_scores ? 'Recalculer le scoring' : 'Calculer la shortlist (5)';
    const scoreResultEl = document.createElement('div');
    scoreResultEl.className = 'score-result';
    scoreBtn.addEventListener('click', async function () {
      scoreBtn.disabled = true;
      try {
        const res = await callAdmin('score', { id: row.id });
        row.operateurs_scores = res.result;
        renderScoreResult(scoreResultEl, res.result);
        scoreBtn.textContent = 'Recalculer le scoring';
      } catch (err) {
        alert(err.message);
      } finally {
        scoreBtn.disabled = false;
      }
    });
    actions.appendChild(scoreBtn);

    if (row.operateurs_scores) {
      renderScoreResult(scoreResultEl, row.operateurs_scores);
    }

    bodyEl.appendChild(notes);
    bodyEl.appendChild(actions);
    bodyEl.appendChild(scoreResultEl);

    card.appendChild(head);
    card.appendChild(bodyEl);
    listEl.appendChild(card);
  });
}

async function loadRows() {
  const result = await callAdmin('list');
  rows = result.rows || [];
  renderList();
}

loginBtn.addEventListener('click', async function () {
  loginError.textContent = '';
  password = passwordInput.value;
  if (!password) {
    loginError.textContent = 'Mot de passe requis.';
    return;
  }
  loginBtn.disabled = true;
  try {
    await loadRows();
    loginBox.style.display = 'none';
    mainView.style.display = 'block';
  } catch (err) {
    loginError.textContent = err.message;
    password = '';
  } finally {
    loginBtn.disabled = false;
  }
});
passwordInput.addEventListener('keydown', function (e) {
  if (e.key === 'Enter') loginBtn.click();
});

refreshBtn.addEventListener('click', function () {
  loadRows().catch(function (err) { alert(err.message); });
});
</script>
</body>
</html>
